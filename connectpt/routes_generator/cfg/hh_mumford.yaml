# Selection hyper-heuristic (Ahmed et al. 2019) -- ported from
# AHolliday/transit_learning (cfg/hyperheuristic_mumford.yaml). The notebook
# helper `build_hh_cfg` adds `+eval=mumford0` and overrides these values for
# the comparison runs.
#
# `f_0` is the Great Deluge final cost level. `delta_F` (the starting level's
# height above f_0) is omitted -> the algorithm sets it to max(f0_cost - f_0, 0).
# Provide exactly one of `n_iterations` / `duration_s` as the stopping budget.
f_0: 0.0
n_iterations: 2000
# delta_F:        # optional; auto-computed from the initial cost when omitted
# duration_s:     # optional wall-clock budget, mutually exclusive with n_iterations

defaults:
  - _self_
  - experiment: standard
  - init: john
