# Report config for the bee-type comparison: read the per-run search artifacts
# and build comparison tables/plots (the report runs no search itself).
report:
  name: bee_type_comparison_report
  input_dir: artifacts/runs/bee_type_comparison
  output_dir: artifacts/reports/bee_type_comparison

runs:
  - bee_type_comparison/00_classic_bco
  - bee_type_comparison/01_nbco_construction
  - bee_type_comparison/02_nbco_edit_extend
  - bee_type_comparison/03_nbco_edit_trim
  - bee_type_comparison/04_nbco_edit_full
  - bee_type_comparison/05_nbco_construction_plus_edit
  - bee_type_comparison/06_nbco_compound_trim_then_construct

tables:
  - search_comparison

plots:
  - cost_comparison
