name: edit
params:
  diff_reward: true
  reward_scale: 1.0
  force_linking_unlinked: ${model.route_generator.kwargs.force_linking_unlinked}
  max_act_len: ${model.route_generator.kwargs.max_act_len}
  max_route_edit_steps: 30
  max_trim_actions_per_route: 1
  force_nonhalt_first_step: true
  allow_trim_below_min: ${model.route_generator.kwargs.allow_trim_below_min}
  forbid_halt_when_overlong: ${model.route_generator.kwargs.forbid_halt_when_overlong}
