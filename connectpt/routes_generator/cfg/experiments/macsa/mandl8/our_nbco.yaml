# @package _global_
# MACSA Table-B (Mandl8 scenario): Our NBCO alpha sweep. Replaces flat
# macsa/our_nbco_mandl8 (sweep from macsa_sweep.yaml).
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: our_nbco
  - _self_

run:
  name: macsa/mandl8/our_nbco
  label: Our NBCO (GNN + trim/extend)
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/macsa/mandl8/our_nbco

# n_bees must match the bee-set total.
search:
  n_bees: 10

data:
  source: macsa
  scenario: Mandl8

sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.3
  n_iterations: 100

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
