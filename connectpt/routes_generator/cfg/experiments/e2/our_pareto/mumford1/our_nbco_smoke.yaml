# @package _global_
# Smoke variant of e2/our_pareto/mumford1/our_nbco: same declarative run, but a
# 2-iteration sweep for a fast dry-run (TEMP_ outputs). Composes the full config
# and overrides only the iteration budget + run name -- config-first, no code
# value-substitution.
defaults:
  - our_nbco
  - _self_

run:
  name: e2/our_pareto/mumford1/our_nbco_smoke

paths:
  output_dir: artifacts/runs/e2/our_pareto/mumford1/our_nbco_smoke

sweep:
  n_iterations: 2
