# @package _global_
# Table 6: four BCO operator combinations on Mumford1, swept over the RTT-WMC
# weight alpha. Adjustment penalty is disabled. Every method uses ten bees,
# split evenly between its two mutation operators.
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: our_nbco
  - _self_

run:
  name: table6_bco_comparison
  seed: 0
  cpu: false

search:
  n_bees: 10

data:
  source: benchmark
  city: Mumford1

sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.2
  adj_weight: 0.0
  n_iterations: 400

# These columns are persisted for both the optimized networks and Initial.
metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", d0, d1, d2, d_un, cost]

logging:
  tensorboard: true

methods:
  - label: "GNN + trim/extend"
    bee_sets: our_nbco
    models: construction_and_edit_seeded
    n_bees: 10
  - label: "GNN + type2"
    bee_sets: neural_bco
    models: construction_only
    n_bees: 10
  - label: "Classic BCO"
    bee_sets: classic_bco_paper
    models: no_neural_models
    n_bees: 10
  - label: "New NBCO (classic + trim/extend)"
    bee_sets: classic_trim_extend
    models: edit_only_seeded
    n_bees: 10

batch:
  name: table6_bco_comparison
  output_dir: artifacts/runs/table6_bco_comparison
  include_initial_metrics: true

output:
  paper_stem: table6_bco_comparison
