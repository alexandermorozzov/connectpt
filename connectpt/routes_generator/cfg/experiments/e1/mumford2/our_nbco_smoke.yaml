# @package _global_
# Smoke variant of e1/mumford2/our_nbco: 2-iteration sweep for a fast dry-run (TEMP_ outputs).
# Config-first (inherit full config + override the budget), no code substitution.
defaults:
  - our_nbco
  - _self_

run:
  name: e1/mumford2/our_nbco_smoke

paths:
  output_dir: artifacts/runs/e1/mumford2/our_nbco_smoke

sweep:
  n_iterations: 2
