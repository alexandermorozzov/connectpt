# @package _global_
# E1 narrow (Mumford2): Our NBCO alpha sweep (neural rebuild + learned trim/extend edit, golden seeded models). Replaces flat nbco_variants/our_nbco_*.
# Declarative bee_colony_search run -- BeeColonySearchRun loads the Mumford2
# benchmark instance and sweeps cfg.sweep (alpha x adj_target) over it; the bee
# mix + models come from the reusable groups, the city/bounds from the source.
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: our_nbco
  - _self_

run:
  name: e1/mumford2/our_nbco
  label: Our NBCO (GNN rebuild + trim/extend)
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/e1/mumford2/our_nbco

# n_bees must match the bee-set total.
search:
  n_bees: 10

data:
  source: benchmark
  city: Mumford2

sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.3
  n_iterations: 200

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
