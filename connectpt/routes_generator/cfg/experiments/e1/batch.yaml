# @package _global_
# E1 narrow: neural BCO vs Our NBCO alpha sweep (multi-method comparison via
# ExperimentBatch -- one run per method, each its own alpha sweep). City-agnostic:
# run_batch("e1/batch", suite, city=<City>) drives any benchmark city; the paper
# stem is suffixed with the city so per-city outputs stay separate.
batch:
  name: e1
  output_dir: artifacts/runs/e1
  runs:
    - experiments/e1/neural_bco
    - experiments/e1/our_nbco

output:
  paper_stem: e1
