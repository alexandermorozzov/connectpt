# @package _global_
# E1 narrow: Our NBCO alpha sweep (neural rebuild + learned trim/extend edit,
# golden seeded models). City-agnostic -- one leaf per method; the city is a
# runtime parameter (build_experiment(city=...)), defaulting to the /data group
# (Mandl). Bee mix + models come from the reusable groups; the sweep block holds
# the default alpha x adj_target grid, overridable in code.
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: our_nbco
  - _self_

run:
  name: e1/our_nbco
  label: Our NBCO (GNN rebuild + trim/extend)
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/e1/our_nbco

# n_bees must match the bee-set total (5 rebuild + 5 edit).
search:
  n_bees: 10

data:
  source: benchmark

sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.3
  n_iterations: 200

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
