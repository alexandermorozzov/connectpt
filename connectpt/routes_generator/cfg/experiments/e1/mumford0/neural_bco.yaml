# @package _global_
# E1 narrow (Mumford0): paper "neural BCO" alpha sweep (Holliday NeuralBCO --
# neural full-route rebuild + random local-endpoint edit, construction model only).
# Declarative bee_colony_search run; replaces flat nbco_variants/neural_bco_*.
defaults:
  - /search: bee_colony_base
  - /search/models: construction_only
  - /search/bee_sets: neural_bco
  - _self_

run:
  name: e1/mumford0/neural_bco
  label: neural BCO
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/e1/mumford0/neural_bco

# n_bees must match the bee-set total (5 rebuild + 5 edit).
search:
  n_bees: 10

data:
  source: benchmark
  city: Mumford0

sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.3
  n_iterations: 200

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
