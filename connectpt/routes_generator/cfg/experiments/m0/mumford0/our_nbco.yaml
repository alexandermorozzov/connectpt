# @package _global_
# M0 NBCO variants (Mumford0): Our NBCO at alpha=0.5. Replaces flat
# nbco_variants/our_nbco_mumford0 (sweep from m0_variants.yaml).
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: our_nbco
  - _self_

run:
  name: m0/mumford0/our_nbco
  label: Our NBCO (GNN + trim/extend)
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/m0/mumford0/our_nbco

# n_bees must match the bee-set total.
search:
  n_bees: 10

data:
  source: benchmark
  city: Mumford0

sweep:
  alpha: [0.5]
  adj_target: 0.3
  n_iterations: 200

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
