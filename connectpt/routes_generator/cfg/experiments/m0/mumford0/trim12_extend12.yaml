# @package _global_
# M0 NBCO variants (Mumford0): trim12+extend12 at alpha=0.5. Replaces
# flat nbco_variants/trim12_extend12_mumford0.
defaults:
  - /search: bee_colony_base
  - /search/models: construction_and_edit_seeded
  - /search/bee_sets: trim12_extend12
  - _self_

run:
  name: m0/mumford0/trim12_extend12
  label: Trim 12 + extend 12
  seed: 0
  cpu: false

paths:
  output_dir: artifacts/runs/m0/mumford0/trim12_extend12

# n_bees must match the bee-set total.
search:
  n_bees: 24

data:
  source: benchmark
  city: Mumford0

sweep:
  alpha: [0.5]
  adj_target: 0.3
  n_iterations: 200

metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
