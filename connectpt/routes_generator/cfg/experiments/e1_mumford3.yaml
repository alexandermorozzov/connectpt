# Unified experiment: E1 narrow on Mumford3 -- neural BCO vs Our NBCO alpha sweep
# (was run_city_e1u_nbco_our_alpha). adj_target/iterations match E1U_* defaults.
name: e1_mumford3
data:
  source: benchmark
  city: Mumford3
methods:
  - label: neural BCO
    config: nbco_variants/neural_bco_mumford3
  - label: Our NBCO (GNN rebuild + trim/extend)
    config: nbco_variants/our_nbco_mumford3
sweep:
  alpha: [0.0, 0.5, 1.0]
  adj_target: 0.3
  n_iterations: 200
metrics: [RTT, WMC, ATT, adj_vs_seed, "redun%", cost]
report:
  routes_plot: pareto
