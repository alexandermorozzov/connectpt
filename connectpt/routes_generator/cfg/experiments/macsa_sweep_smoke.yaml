# Smoke variant (minimum load: 1 iteration, single alpha/target) -- just
# checks that this experiment turns on and runs end to end.
name: macsa_sweep_smoke
data:
  source: macsa
  scenario: Mandl8
method:
  config: nbco_variants/our_nbco_mandl
method_label: Our NBCO (GNN + trim/extend)
sweep:
  alpha:
  - 0.5
  adj_target: 0.3
  n_iterations: 1
metrics:
- RTT
- WMC
- ATT
- adj_vs_seed
- redun%
- cost
report:
  routes_plot: network
