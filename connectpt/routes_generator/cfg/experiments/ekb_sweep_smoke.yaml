# Smoke variant (minimum load: 1 iteration, single alpha/target) -- just
# checks that this experiment turns on and runs end to end.
name: ekb_sweep_smoke
data:
  source: ekb
method:
  config: ekb/our_nbco_ekb
  force_cpu: true
  process_neural_bees_sequentially: true
method_label: Our NBCO (GNN + trim/extend)
sweep:
  alpha:
  - 0.5
  adj_target: 0.3
  n_iterations: 1
metrics:
- RTT
- WMC
- ATT
- adj_vs_seed
- redun%
- cost
report:
  routes_plot: gis
