# @package _global_
# Smoke / dry-run profile: EVERY experiment ON, single city, 1-iteration specs,
# all outputs under the TEMP_ prefix so nothing real is overwritten. Just verifies
# the whole notebook runs end to end. (The per-experiment smoke specs -- e1_*_smoke,
# e2_*_smoke, macsa_sweep_smoke, ekb_sweep_smoke, train/edit_scratch_smoke -- carry
# the 1-iteration budgets; this profile only flips the switches + the prefix.)
defaults:
  - /experiments/suite
  - _self_

profile: smoke
smoke: true
quick: false
output_prefix: "TEMP_"
cities: [Mandl]

run:
  training: true
  clean_lc_baseline: true
  e2_our_pareto: true
  e2_5model: true
  e2_route_viz: true
  m0_nbco_variants: true
  macsa: true
  nsgaii_baselines: true
  ekb_case_study: true
  ekb_nbco: true
  ekb_alpha_sweep: true

e1:
  cities: [Mandl]
  run_neural_bco: true
  run_our_model: true

ekb:
  nbco:
    iterations: 1
  sweep:
    iterations: 1
    alpha_grid: [0.5]
