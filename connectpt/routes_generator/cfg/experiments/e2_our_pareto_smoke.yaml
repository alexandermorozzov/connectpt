# Smoke variant (minimum load: 1 iteration, single alpha/target) -- just
# checks that this experiment turns on and runs end to end.
name: e2_our_pareto_smoke
data:
  source: benchmark
  city: Mumford1
method:
  config: nbco_variants/our_nbco_mumford1
method_label: Our NBCO
sweep:
  alpha:
  - 0.5
  adj_target:
  - 0.2
  n_iterations: 1
metrics:
- RTT
- WMC
- ATT
- adj_vs_seed
- redun%
- cost
report:
  routes_plot: pareto
