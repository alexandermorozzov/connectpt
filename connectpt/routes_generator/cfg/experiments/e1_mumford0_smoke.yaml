# Smoke variant (minimum load: 1 iteration, single alpha/target) -- just
# checks that this experiment turns on and runs end to end.
name: e1_mumford0_smoke
data:
  source: benchmark
  city: Mumford0
methods:
- label: neural BCO
  config: nbco_variants/neural_bco_mumford0
- label: Our NBCO (GNN rebuild + trim/extend)
  config: nbco_variants/our_nbco_mumford0
sweep:
  alpha:
  - 0.5
  adj_target: 0.3
  n_iterations: 1
metrics:
- RTT
- WMC
- ATT
- adj_vs_seed
- redun%
- cost
report:
  routes_plot: pareto
