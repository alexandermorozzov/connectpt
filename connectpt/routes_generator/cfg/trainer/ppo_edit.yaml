# @package _global_
ppo:
  n_iterations: 200
  val_period: 10
  n_epochs: 1
  minibatch_size: 256
  horizon: 200
  epsilon: 0.2
  use_gae: true
  gae_lambda: 0.95

trainer: ppo
discount_rate: 1.0
diff_reward: true
max_trim_actions_per_route: 1
shared_critic: false
baseline_lr: 0.0005
entropy_weight: 0.05
batch_size: 512
reward_scale: 1.0
edit_step_penalty: 0
forced_halt_penalty: 0
lr: 0.0003
decay: 0.00001
optimizer: Adam
normalize_advantages: true
force_nonhalt_first_step_until_iter: 150

adjustment_conditioning: false
adjustment_condition_current: false
adjustment_condition_weight: false
adjustment_target_min: 0.2
adjustment_target_max: 1.0

critic_normalize_returns: true
critic_huber: true
critic_huber_delta: 1.0
critic_value_clip: 0.2

train_loop:
  n_iterations: 700
  batch_size_cpu: 4
  batch_size_cuda: 16
