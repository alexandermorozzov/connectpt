# @package _global_
trainer: ppo
batch_size: 64
baseline_lr: 0.0005
lr: 0.0016134816080499328
decay: 0.0008404361781997002
optimizer: Adam
discount_rate: 1.0
diff_reward: true
reward_scale: 1.0
entropy_weight: 0.0
action_seed: null
train_loop:
  n_iterations: 200
  max_seconds: null
  cpu_threads: 2
ppo:
  n_iterations: ${train_loop.n_iterations}
  val_period: 10
  n_epochs: 1
  minibatch_size: ${batch_size}
  horizon: 120
  epsilon: 0.2
  use_gae: true
  gae_lambda: 0.95
  # Holliday retains preferences through episode resets within a graph batch.
  resample_preferences_on_terminal: false
  holliday_critic_features: true
  advantage_normalization: minibatch
  # Upstream: one initial validation pass, then update/freeze FeatureNorm.
  calibrate_before_validation: false
