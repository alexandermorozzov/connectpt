type: TrimPathCombiningRouteGenerator
kwargs:
  n_nodepair_layers: 3
  n_pathscorer_layers: 3
  pathscorer_hidden_dim: 16
  n_trim_scorer_layers: 3
  trim_scorer_hidden_dim: 16
  n_halt_layers: 3
  halt_scorer_type: "endpoints"
  # n_halt_heads: 4
  serial_halting: true
  forbid_halt_when_overlong: false
  use_redundancy_features: true
  # allow trimming a route below min_route_len (down to 2 stops); halt stays
  # masked until extend restores min. Default off preserves the length contract.
  allow_trim_below_min: false
