defaults:
  - route_generator: biased
  - /features@features: construction_v1
  - _self_

common:
  dropout: 0.0
  nonlin_type: ReLU
  embed_dim: 64

route_generator:
  kwargs:
    force_linking_unlinked: false
    logit_clip: null

backbone_gn:
  net_type: graph attn
  kwargs:
    n_layers: 5
    use_norm: false
    n_heads: 4
    dense: false
