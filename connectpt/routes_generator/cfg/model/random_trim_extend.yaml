common:
  dropout: 0.0
  nonlin_type: ReLU
  embed_dim: 2

route_generator:
  type: RandomTrimExtendRouteGenerator
  kwargs:
    force_linking_unlinked: false
    halt_prob_is_route_time_weight: false
    logit_clip: null
    n_pathscorer_layers: 3
    pathscorer_hidden_dim: 16
    n_trim_scorer_layers: 3
    trim_scorer_hidden_dim: 16
    n_halt_layers: 3
    halt_scorer_type: endpoints
    serial_halting: true
    forbid_halt_when_overlong: false
    use_redundancy_features: true
    allow_trim_below_min: false
    n_adjustment_cond_feats: 0

backbone_gn:
  net_type: none
  kwargs:
    return_edges: false
    in_node_dim: 4
    in_edge_dim: 18

defaults:
  - _self_
