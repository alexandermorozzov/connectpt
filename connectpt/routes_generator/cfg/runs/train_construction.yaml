# @package _global_
run:
  type: training
  name: construction_${algorithm.name}_seed${run.seed}
  cpu: false
paths:
  output_dir: artifacts/runs/${run.name}
  weights_dir: artifacts/model_weights
  checkpoint_path: construction/${run.name}/last.pt
  init_checkpoint_path: null
logger_list:
- tensorboard
- csv
defaults:
- /objectives/cost: att_rtt
- /training/dataset: construction
- /common: experiment
- /policy/model: construction_holliday
- /training/algorithm: ppo
- /env: construction
- /training/curriculum: construction
- _self_
optimizer:
  name: Adam
  learning_rate: 0.0016134816080499328
  decay: 0.0008404361781997002
train_loop:
  n_iterations: 200
  horizon: 120
  val_period: 10
  validate_before_update: true
  max_seconds: null
  batch_size: 64
  batch_size_cuda: 64
  cpu_threads: 2
  warmup_batches: 0
  max_rollout_samples: null
  calibrate_before_validation: false
  action_seed: null
  force_nonhalt_until: null
  resample_preferences_on_terminal: false
  preference_distribution: sampler
algorithm:
  minibatch_size: ${train_loop.batch_size}
  entropy_weight: 0.0
  critic:
    normalize_returns: false
    huber: false
    value_clip: null
evaluation:
  batch_size: null
  validation_mode: sample
  graph_count: 64
  pareto_graph_count: ${evaluation.graph_count}
  test_graph_count: null
  pareto_enabled: true
  pareto_period: 10
  pareto_preference_count: 11
  pareto_stochastic_samples: 1
  hv_reference:
  - 3.0
  - 3.0
  eu_preference_count: 101
  preference_count: 21
  stochastic_samples: 4
  seed: 9001
  final_test: true
