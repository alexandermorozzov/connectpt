# @package _global_
defaults:
  - /model: construction_holliday
  - /experiment: standard
  - /cost: att_rtt
  - /dataset: construction
  - /trainer: ppo_construction
  - _self_
run:
  type: construction_training
  name: construction_${trainer}_seed${run.seed}
  seed: 0
  cpu: false
paths:
  output_dir: artifacts/runs/${run.name}
  weights_dir: artifacts/model_weights
  checkpoint_path: construction/${run.name}/last.pt
  init_checkpoint_path: null
experiment:
  logdir: null
eval:
  n_routes: 10
  min_route_len: 2
  max_route_len: 12
  csv: false
evaluation:
  graph_count: 64
  test_graph_count: null
  pareto_enabled: true
  pareto_period: 10
  pareto_preference_count: 11
  pareto_stochastic_samples: 1
  hv_reference: [3.0, 3.0]
  eu_preference_count: 101
  log_pareto_front: true
  preference_count: 21
  stochastic_samples: 4
  seed: 9001
  final_test: true
