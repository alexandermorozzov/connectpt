# MACSA Mandl-8 case-study scenario -- authoritative spec.
#
# MACSADataSource(scenario="mandl_8").load() reads its route-count / length spec
# from HERE (via eval_spec("macsa_mandl_8")). The seed route count must match and
# every seed route must lie inside these configured bounds;
# tests/test_eval_registry.py guards those invariants against drift.
n_routes: 8
min_route_len: 2
max_route_len: 12
source:
  type: macsa
  scenario: mandl_8
  data_dir: datasets/MACSA_data/mandl_8
