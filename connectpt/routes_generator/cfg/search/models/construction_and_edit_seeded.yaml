# @package _global_
# Models for the seeded paper runs (golden `our_nbco`): the construction rebuild
# model + the golden edit model (edit_trim_seeded = bestsofar_feb2023_trim,
# allow_trim_below_min=false) with the finetuned rttconn-adj checkpoint.
models:
  construction:
    enabled: true
    config: construction
    checkpoint_path: artifacts/model_weights/inductive_random_graphs_weighted_connectivity.pt
    strict_load: true
  edit:
    enabled: true
    config: edit_trim_seeded
    checkpoint_path: artifacts/model_weights/improvement/improvement_lc_rttconn_adj_w10_t02_finetune100.pt
    strict_load: true

policies:
  construction:
    model_ref: construction
    adapter: construction_search_policy
  edit:
    model_ref: edit
    adapter: edit_search_policy
