# @package _global_
defaults:
  - /policy/model_profile@models.construction: construction_v1
  - /policy/model_profile@models.edit: edit_v1
  - _self_

run:
  label: NEA-Combined

method:
  passes_per_it: 5
  mod_steps_per_pass: 2
  shorten_prob: 0.2
  force_linking_unlinked: false
  process_neural_bees_sequentially: false
  bees:
    neural_rebuild:
      count: 5
      operator: neural_rebuild
      model_ref: construction
      allowed_actions: [extend, halt]
      ignore_max_route_len: false
    neural_edit:
      count: 5
      operator: neural_edit
      model_ref: edit
      allowed_actions: [extend, trim_start, trim_end]
      ignore_max_route_len: false
