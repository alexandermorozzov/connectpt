# @package _global_
# Base bee-colony search config. Experiment configs compose this + a model
# availability group (search/models/*) + a bee set group (search/bee_sets/*).
defaults:
  - /objective: rtt_wmc_no_demand
  - /data: mandl_benchmark
  - /search/acceptance: greedy
  - _self_

run:
  type: bee_colony_search
  name: bco_base
  seed: 0
  cpu: false

paths:
  # Output roots. Overridable per run: --weights-dir / --runs-dir on the CLI,
  # weights_dir= / runs_dir= through build_experiment.
  weights_dir: artifacts/model_weights     # checkpoint paths resolve against this
  runs_dir: artifacts/runs                 # per-run scratch: partial CSV, TensorBoard
  output_dir: ${paths.runs_dir}/${run.name}

search:
  algorithm: bee_colony
  n_iterations: 100
  n_bees: 20
  max_passes: 10

# Defaults: no models enabled, no bees. The model/bee-set groups override these.
models:
  construction:
    enabled: false
    config: construction
    checkpoint_path: null
    strict_load: true
  edit:
    enabled: false
    config: edit_trim_paper
    checkpoint_path: null
    strict_load: true

policies: {}

bees: []
